  <script type="module">
    import * as THREE from 'three';

    // =============================================
    // 1. SETUP SCENE, CAMERA, RENDERER
    // =============================================
    const canvas = document.getElementById('hero-canvas');
    const scene = new THREE.Scene();

    // Camera: Matching the slight angle from the reference
    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1.5, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0); 
    
    // Enable soft shadows
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // =============================================
    // 2. LIGHTING (Soft Studio Setup)
    // =============================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    // Main light casting shadows from top-left
    const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
    mainLight.position.set(-5, 8, 5);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.camera.near = 1;
    mainLight.shadow.camera.far = 30;
    mainLight.shadow.camera.left = -10;
    mainLight.shadow.camera.right = 10;
    mainLight.shadow.camera.top = 10;
    mainLight.shadow.camera.bottom = -10;
    mainLight.shadow.bias = -0.0005;
    mainLight.shadow.radius = 4;
    scene.add(mainLight);

    // Fill light for the right side
    const fillLight = new THREE.DirectionalLight(0xe0e7ff, 1.0);
    fillLight.position.set(5, 0, 5);
    scene.add(fillLight);

    // =============================================
    // 3. SHADOW CATCHER FLOOR
    // =============================================
    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.ShadowMaterial({ 
      opacity: 0.12, 
      color: 0x000000 
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3;
    floor.receiveShadow = true;
    scene.add(floor);

    // =============================================
    // 4. SUBTLE GRID
    // =============================================
    const gridHelper = new THREE.GridHelper(30, 30, 0x000000, 0x000000);
    gridHelper.position.y = -2.99;
    gridHelper.material.opacity = 0.04;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // =============================================
    // 5. CREATE THE GLOSSY TUBE
    // =============================================
    // The curve goes from top-center, curves right, then down and off-screen
    const points = [
      new THREE.Vector3(-1.5, 4.5, 0),
      new THREE.Vector3(0.5, 2.5, 1),
      new THREE.Vector3(2.5, 0, 1),
      new THREE.Vector3(3.5, -3, 0),
      new THREE.Vector3(4.5, -6, -1)
    ];
    const curve = new THREE.CatmullRomCurve3(points);

    // Thicker tube to match the reference
    const tubeGeo = new THREE.TubeGeometry(curve, 120, 0.9, 32, false);

    // Glossy, pearlescent white material
    const tubeMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: 0.08,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      envMapIntensity: 1.0,
      side: THREE.DoubleSide,
    });

    const tube = new THREE.Mesh(tubeGeo, tubeMat);
    tube.castShadow = true;
    tube.receiveShadow = true;
    scene.add(tube);

    // =============================================
    // 6. THE GOLD DISC (Embedded in the tube)
    // =============================================
    // Position along the curve (around 60% down)
    const t = 0.55; 
    const pointOnCurve = curve.getPoint(t);
    const tangent = curve.getTangent(t);

    // Create a flat disc (coin)
    const discGeo = new THREE.CylinderGeometry(0.65, 0.65, 0.15, 64);
    const discMat = new THREE.MeshStandardMaterial({
      color: 0xd4af37, // Gold
      metalness: 1.0,
      roughness: 0.15,
    });
    const disc = new THREE.Mesh(discGeo, discMat);
    disc.castShadow = true;
    disc.receiveShadow = true;

    // Position and orient the disc
    disc.position.copy(pointOnCurve);
    
    // Orient the disc to align with the curve, but tilted slightly towards the camera
    const upVector = new THREE.Vector3(0, 1, 0);
    const quaternion = new THREE.Quaternion().setFromUnitVectors(
      upVector, 
      tangent.clone().normalize()
    );
    disc.quaternion.copy(quaternion);
    
    // Rotate it slightly so the face is visible to the camera
    disc.rotateX(Math.PI / 2);
    disc.rotateZ(Math.PI / 4);

    scene.add(disc);

    // =============================================
    // 7. FLOATING PARTICLES (Stardust)
    // =============================================
    const particlesGeo = new THREE.BufferGeometry();
    const particleCount = 400;
    const positions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 25;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
    }

    particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particlesMat = new THREE.PointsMaterial({
      size: 0.06,
      color: 0x9ca3af,
      transparent: true,
      opacity: 0.4,
      sizeAttenuation: true,
    });

    const particles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particles);

    // =============================================
    // 8. ANIMATION LOOP
    // =============================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Gentle floating motion for particles
      particles.rotation.y = elapsedTime * 0.01;
      particles.rotation.x = Math.sin(elapsedTime * 0.05) * 0.02;

      // Subtle pulsing of the gold disc
      disc.scale.setScalar(1 + Math.sin(elapsedTime * 1.5) * 0.03);

      renderer.render(scene, camera);
    }

    animate();

    // =============================================
    // 9. RESIZE HANDLER
    // =============================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
